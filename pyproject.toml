[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-rag-agent"
version = "0.3.0"
description = "荟诊 · 芦荟病虫害智能问答与诊断 Agent（RAG + Function Calling）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agri-agent = "agri_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
