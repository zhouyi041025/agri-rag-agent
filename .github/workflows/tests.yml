name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov ruff

      - name: 代码检查（ruff）
        run: ruff check .

      - name: 运行测试（含覆盖率门槛）
        run: python -m pytest -q --cov=agri_agent --cov-report=term --cov-fail-under=78

      - name: 复现检索评测指标
        run: python eval/run_eval.py
