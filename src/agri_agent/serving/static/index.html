<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>荟诊 · 芦荟病虫害智能问答与诊断 Agent</title>
<style>
  :root {
    --bg: #f4f6f4; --panel: #ffffff; --line: #e2e8e2; --ink: #1c2b1f;
    --muted: #6b7a6e; --brand: #2f7d4f; --brand-soft: #e8f3ec; --warn: #b8860b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 22px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  .pill { margin-left: auto; background: var(--brand-soft); color: var(--brand);
    padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(320px,1fr);
    gap: 16px; padding: 16px 22px 24px; height: calc(100vh - 58px); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden; }
  .panel h2 { margin: 0; padding: 12px 16px; font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--line); font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; padding: 11px 14px; border-radius: 12px; white-space: pre-wrap;
    line-height: 1.65; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; }
  .msg.bot { align-self: flex-start; background: #f4f7f4; border: 1px solid var(--line); }
  .msg.bot.pending { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  form { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 9px; font-size: 14px; font-family: inherit; }
  input[type=text]:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
  button[type=submit] { padding: 11px 22px; border: 0; border-radius: 9px; background: var(--brand);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button[type=submit]:disabled { opacity: .55; cursor: not-allowed; }
  #side { overflow-y: auto; padding: 14px 16px; }
  .side-block { margin-bottom: 18px; }
  .side-block h3 { font-size: 12px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .card { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 8px;
    background: #fbfdfb; font-size: 12px; line-height: 1.6; }
  .card .tag { display: inline-block; background: var(--brand-soft); color: var(--brand);
    border-radius: 5px; padding: 1px 6px; font-size: 11px; margin-right: 6px; font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 11px; }
  .trace { display: flex; gap: 8px; align-items: baseline; font-size: 12px; padding: 5px 0;
    border-bottom: 1px dashed var(--line); }
  .trace .name { font-weight: 600; color: var(--brand); }
  .trace .ms { margin-left: auto; color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>荟诊 · 芦荟病虫害智能问答与诊断 Agent</h1>
  <span class="sub">RAG 混合检索 + Function Calling 工具调用</span>
  <span class="pill" id="status">加载中…</span>
</header>
<main>
  <section class="panel">
    <h2>对话</h2>
    <div id="chat"></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <input type="text" id="input" placeholder="例如：叶片上出现褐色凹陷病斑是什么病？该怎么处理？" autocomplete="off" />
      <button type="submit" id="send">发送</button>
    </form>
  </section>
  <section class="panel">
    <h2>溯源与工具调用</h2>
    <div id="side">
      <div class="side-block"><h3>知识库引用</h3><div id="citations" class="empty">提问后显示命中的知识库片段</div></div>
      <div class="side-block"><h3>工具调用轨迹</h3><div id="traces" class="empty">提问后显示 Agent 的工具调用过程</div></div>
    </div>
  </section>
</main>
<script>
const chatEl = document.getElementById("chat");
const citeEl = document.getElementById("citations");
const traceEl = document.getElementById("traces");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const history = [];

const EXAMPLES = [
  "芦荟炭疽病怎么防治？",
  "叶片上出现褐色凹陷病斑是什么病？",
  "S3 现在田间环境怎么样？",
  "我有 5 亩芦荟要防治炭疽病，代森锰锌要用多少量？",
  "未来三天能打药吗？"
];

fetch("/health").then(r => r.json()).then(d => {
  document.getElementById("status").textContent =
    (d.agent === "llm" ? "大模型模式：" + d.llm_model : "规则降级模式（未配置 API Key）") +
    ` · 知识块 ${d.kb.chunks}`;
}).catch(() => { document.getElementById("status").textContent = "服务未就绪"; });

EXAMPLES.forEach(text => {
  const chip = document.createElement("button");
  chip.className = "chip"; chip.type = "button"; chip.textContent = text;
  chip.onclick = () => { input.value = text; form.requestSubmit(); };
  document.getElementById("chips").appendChild(chip);
});

function bubble(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls; div.textContent = text;
  chatEl.appendChild(div); chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function renderCitations(list) {
  if (!list || !list.length) { citeEl.className = "empty"; citeEl.textContent = "本次回答未引用知识库片段"; return; }
  citeEl.className = ""; citeEl.innerHTML = "";
  list.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<span class="tag">[${c.index}]</span>${c.doc}${c.section ? " · " + c.section : ""}
      <div class="meta">score ${c.score} · ${c.retriever}</div>`;
    citeEl.appendChild(card);
  });
}

function renderTrace(steps) {
  if (!steps || !steps.length) { traceEl.className = "empty"; traceEl.textContent = "本次回答未调用工具"; return; }
  traceEl.className = ""; traceEl.innerHTML = "";
  steps.forEach(s => {
    const row = document.createElement("div");
    row.className = "trace";
    row.innerHTML = `<span class="name">${s.name}</span>
      <span class="meta">${JSON.stringify(s.arguments)}</span>
      <span class="ms">${s.latency_ms}ms</span>`;
    traceEl.appendChild(row);
  });
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = ""; sendBtn.disabled = true;
  bubble(message, "user");
  const pending = bubble("正在检索知识库并调用工具…", "bot pending");
  citeEl.className = "empty"; citeEl.textContent = "检索中…";
  traceEl.className = "empty"; traceEl.textContent = "等待工具调用…";

  try {
    const response = await fetch("/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, history: history.slice(-6) })
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const event = JSON.parse(line.slice(6));
        if (event.type === "step") {
          const steps = Array.from(traceEl.querySelectorAll(".trace")).length;
          if (steps === 0) { traceEl.className = ""; traceEl.innerHTML = ""; }
          const row = document.createElement("div");
          row.className = "trace";
          row.innerHTML = `<span class="name">${event.step.name}</span>
            <span class="meta">${JSON.stringify(event.step.arguments)}</span>
            <span class="ms">${event.step.latency_ms}ms</span>`;
          traceEl.appendChild(row);
        } else if (event.type === "final") {
          pending.classList.remove("pending");
          pending.textContent = event.payload.answer;
          renderCitations(event.payload.citations);
          renderTrace(event.payload.steps);
          history.push({ role: "user", content: message });
          history.push({ role: "assistant", content: event.payload.answer });
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (event.type === "error") {
          pending.classList.remove("pending");
          pending.textContent = "出错了：" + event.message;
        }
      }
    }
  } catch (err) {
    pending.classList.remove("pending");
    pending.textContent = "请求失败：" + err;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
